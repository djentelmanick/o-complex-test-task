[project]
name = "inquiry-assistant"
version = "0.1.0"
description = "O-complex inquiry assistant: client reply + upsell hint via RAG and GigaChat"
authors = [
    {name = "Плясов Николай Викторович",email = "nvpliasov@edu.hse.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy[asyncio] (>=2.1.1,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pgvector (>=0.5.0,<0.6.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "slowapi (>=0.1.10,<0.2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
respx = "^0.23.1"
asgi-lifespan = "^2.1.0"
ruff = "^0.16.9"
mypy = "^2.3.1"


[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires a running PostgreSQL with pgvector (TEST_DATABASE_URL)"]
filterwarnings = ["ignore:.*iscoroutinefunction.*:DeprecationWarning:slowapi"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "context"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.application.*"]
strict = true
