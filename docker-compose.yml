services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: assistant
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://assistant:${POSTGRES_PASSWORD}@db:5432/assistant
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  tunnel:
    profiles: ["amocrm"]
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://app:8000"]
    depends_on:
      - app
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://assistant:${POSTGRES_PASSWORD}@db:5432/assistant_test
      DATABASE_URL: postgresql+asyncpg://assistant:${POSTGRES_PASSWORD}@db:5432/assistant
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
